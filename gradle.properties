# Настройки самой сборки.
# Xmx2G — сколько памяти можно сборке, parallel — собирать быстрее.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Какой JDK использовать для сборки и для запуска Minecraft.
# Путь пишем через прямой слэш: в этом файле обратный слэш считается спецсимволом.
# ВАЖНО: путь привязан к этой машине. Если проект откроют на другой — строку надо поменять.
org.gradle.java.home=Z:/Android/JDK/25

# Версии Fabric (проверять на https://fabricmc.net/develop).
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
fabric_api_version=0.163.0+26.3

# Данные нашего мода.
version=0.1.0
group=com.chr0m4ik
